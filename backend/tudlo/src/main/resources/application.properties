spring.application.name=tudlo
spring.datasource.url=jdbc:mariadb://localhost:3306/tudlo
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

server.port=8081

app.jwt.secret=${APP_JWT_SECRET:change-this-to-a-long-random-string-at-least-32-characters}
app.bootstrap-admin.password=Admin123
