spring.application.name=tudlo
spring.datasource.url=jdbc:mariadb://localhost:3306/tudlo
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:${JWT_SECRET:defaultSecretKeyThatIsAtLeast32CharactersLongForHS256Algorithm}}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:${JWT_EXPIRATION_MS:86400000}}
