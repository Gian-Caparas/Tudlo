spring.application.name=tudlo
spring.datasource.url=jdbc:mariadb://localhost:3306/tudlo
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=com.csit321G6.groufings.tudlo.config.MariaDB104Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Preserve column/table name casing for MySQL on Windows
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Default Admin Bootstrap Seed (R2)
app.seed.admin.user-id-number=${SEED_ADMIN_USER_ID:2026-0001}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:admin123}
app.seed.admin.first-name=${SEED_ADMIN_FIRST_NAME:System}
app.seed.admin.last-name=${SEED_ADMIN_LAST_NAME:Administrator}

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:${JWT_SECRET:defaultSecretKeyThatIsAtLeast32CharactersLongForHS256Algorithm}}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:${JWT_EXPIRATION_MS:86400000}}
