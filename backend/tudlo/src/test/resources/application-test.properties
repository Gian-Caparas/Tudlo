spring.datasource.url=jdbc:h2:mem:tudlo_test;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Default Admin Bootstrap Seed for tests
app.seed.admin.user-id-number=2026-0001
app.seed.admin.password=admin123
app.seed.admin.first-name=System
app.seed.admin.last-name=Administrator

# Test JWT secret
app.jwt.secret=testSecretKeyThatIsAtLeast32CharactersLongForHS256Algorithm
app.jwt.expiration-ms=86400000
